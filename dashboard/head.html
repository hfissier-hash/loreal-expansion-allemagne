<title>L'Oréal en Allemagne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* Layout : bandeau décision, tuiles KPI, filtres, grille de graphiques par axe, panneau IA */
  :root {
    --bg: #f5f4f0; --panel: #ffffff; --ink: #1c1b22; --muted: #5d5b66; --line: #e3e0d8;
    --accent: #3346c4; --accent-soft: #e6e9fb; --ref: #a9a6b3; --good: #17804a; --bad: #c2410c; --bad-soft: #fde9df; --warn: #a16207;
    --display: "Fraunces", Georgia, serif; --body: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15141a; --panel: #1e1d25; --ink: #f0eef5; --muted: #a7a4b3; --line: #33313d;
    --accent: #8b9bff; --accent-soft: #272b4d; --ref: #6c6979; --good: #4ade80; --bad: #fb923c; --bad-soft: #3a2418; --warn: #fbbf24; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #15141a; --panel: #1e1d25; --ink: #f0eef5; --muted: #a7a4b3; --line: #33313d;
    --accent: #8b9bff; --accent-soft: #272b4d; --ref: #6c6979; --good: #4ade80; --bad: #fb923c; --bad-soft: #3a2418; --warn: #fbbf24; color-scheme: dark }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h2 { font-size: 17px; font-weight: 600; margin: 0; text-wrap: balance; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
  p { margin: 0; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
  .hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
  .hero-q { display: flex; flex-direction: column; gap: 12px; }
  .lede { color: var(--muted); max-width: 62ch; }
  .verdict { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .pill { align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .verdict b { font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .v { font-family: var(--display); font-size: 28px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .l { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
  .tile .d { font-size: 13px; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--ink); background: transparent; border: 0; padding: 7px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filters .note { font-size: 12px; color: var(--muted); flex: 1 1 220px; }
  .axis-title { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .chart { position: relative; min-height: 200px; }
  .chart svg { display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 12px; font-family: var(--body); }
  .chart .strong { fill: var(--ink); font-variant-numeric: tabular-nums; }
  .chart .neg { fill: var(--bad); font-weight: 600; }
  .chart .tick line { stroke: var(--line); } .chart .domain { stroke: var(--line); }
  .take { font-size: 13.5px; color: var(--ink); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
  .take b { font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: nowrap; z-index: 3; }
  .tip span { color: var(--muted); }
  .ai { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .ai-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .btn { font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn[disabled] { opacity: .5; cursor: default; }
  .md { font-size: 14.5px; max-width: 80ch; display: flex; flex-direction: column; gap: 10px; }
  .md h4 { font-size: 15px; margin: 6px 0 0; }
  .md ul, .md ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .md table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .md td, .md th { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md em { color: var(--muted); }
  .scroll { overflow-x: auto; }
  .src { font-size: 12.5px; color: var(--muted); }
  .src a { color: var(--accent); }
  .src ul { padding-left: 1.2em; margin: 6px 0 0; columns: 2 320px; }
  .status { font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
